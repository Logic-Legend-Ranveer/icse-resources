<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICSE RESOURCES</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 30px;
      margin: 0;
      overflow-x: hidden;
    }

    h1 {
      color: #00ffcc;
      margin-bottom: 20px;
    }

    .folder-header {
      background: #252526;
      color: #ffd700;
      padding: 10px 14px;
      margin: 6px 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .folder-header:hover {
      background: #333333;
    }

    .folder-content {
      margin-left: 20px;
      border-left: 2px solid #333;
      padding-left: 10px;
      display: none;
    }

    .folder-content.open {
      display: block;
    }

    .file {
      background: #1e1e1e;
      padding: 10px 14px;
      margin: 4px 0;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    a {
      color: #66ccff;
      text-decoration: none;
      font-size: 16px;
    }

    a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    .file-preview-button {
      background: none;
      border: 0;
      color: #66ccff;
      cursor: pointer;
      font: inherit;
      font-size: 16px;
      padding: 0;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .file-preview-button:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    .loading {
      color: #aaa;
      font-style: italic;
      padding: 6px 14px;
    }

    .download-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 6px 0 10px;
    }

    .download-all {
      background: #12352f;
      border: 1px solid #00b894;
      color: #d7fff6;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      text-align: left;
      flex: 1 1 260px;
    }

    .download-all:hover {
      background: #165146;
    }

    .download-all:disabled {
      cursor: wait;
      opacity: 0.75;
    }

    .preview-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      background: rgba(0, 0, 0, 0.92);
    }

    .preview-modal.open {
      display: flex;
      flex-direction: column;
    }

    .preview-toolbar {
      background: #1e1e1e;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      min-height: 44px;
    }

    .preview-title {
      color: #fff;
      font-weight: 700;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preview-action {
      background: #252526;
      border: 1px solid #444;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
      padding: 8px 12px;
    }

    .preview-action:hover {
      background: #333;
    }
    .preview-pages {
      flex: 1;
      overflow: auto;
      padding: 18px;
      background: #151515;
      text-align: center;
    }

    .preview-pages canvas {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto 18px;
      background: white;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.45);
    }

    @media (max-width: 700px) {
      body {
        padding: 14px;
      }

      h1 {
        font-size: 24px;
        margin: 0 0 14px;
      }

      .folder-header,
      .file,
      .download-all {
        padding: 12px;
        font-size: 15px;
      }

      .folder-content {
        margin-left: 8px;
        padding-left: 8px;
      }

      .download-actions {
        flex-direction: column;
      }

      .download-all {
        flex: 1 1 auto;
        width: 100%;
      }

      .preview-toolbar {
        align-items: stretch;
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px;
      }

      .preview-title {
        flex-basis: 100%;
        font-size: 14px;
        white-space: normal;
      }

      .preview-action {
        flex: 1;
        text-align: center;
        padding: 10px;
      }

      .preview-pages {
        padding: 8px;
      }

      .preview-pages canvas {
        margin-bottom: 10px;
      }
    }
  </style>
</head>

<body>
<h1>Downloads</h1>

<div id="files"></div>
<div id="previewModal" class="preview-modal">
  <div class="preview-toolbar">
    <div id="previewTitle" class="preview-title">PDF Preview</div>
    <a id="previewDownload" class="preview-action" href="#" download>Download</a>
    <button id="previewClose" class="preview-action" type="button">Close</button>
  </div>
  <div id="previewPages" class="preview-pages"></div>
</div>
<script data-goatcounter="https://icse-resources-analytics.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
const username = "Logic-Legend-Ranveer";
const repo = "public-files";
let previewSession = 0;

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
}

async function loadFolder(path, containerElement) {
  const url = `https://api.github.com/repos/${username}/${repo}/contents/${path}`;

  try {
    const response = await fetch(url);

    if (response.status === 403) {
      containerElement.innerHTML = `
        <div class="loading" style="color: #ffcc00; font-weight: bold;">
          GitHub API rate limit reached (60 requests/hr). <br>
          Please wait a few minutes before refreshing again.
        </div>`;
      return;
    }

    if (response.status === 404) {
      containerElement.innerHTML = `
        <div class="loading" style="color: #ff6b6b;">
          Folder path "${path}" was not found. Check folder names.
        </div>`;
      return;
    }

    const data = await response.json();
    containerElement.innerHTML = "";

    if (!Array.isArray(data) || data.length === 0) {
      containerElement.innerHTML = `<div class="loading">No files found in this folder.</div>`;
      return;
    }

    const visibleItems = data.filter(item => item.name.toLowerCase() !== "index.html");
    const pdfFiles = visibleItems.filter(item => item.type === "file" && item.name.toLowerCase().endsWith(".pdf"));
    const hasSubfolders = visibleItems.some(item => item.type === "dir");

    if (pdfFiles.length > 0 && !hasSubfolders) {
      const downloadActions = document.createElement("div");
      downloadActions.className = "download-actions";

      const individualButton = document.createElement("button");
      individualButton.className = "download-all";
      individualButton.type = "button";
      individualButton.textContent = `Save all PDFs individually to a folder (${pdfFiles.length})`;
      individualButton.addEventListener("click", () => savePdfsIndividuallyToFolder(pdfFiles, individualButton));

      const zipButton = document.createElement("button");
      zipButton.className = "download-all";
      zipButton.type = "button";
      zipButton.textContent = `Download all PDFs as .zip (${pdfFiles.length})`;
      zipButton.addEventListener("click", () => downloadPdfsAsZip(path, pdfFiles, zipButton));

      downloadActions.appendChild(individualButton);
      downloadActions.appendChild(zipButton);
      containerElement.appendChild(downloadActions);
    }

    for (const item of visibleItems) {
      if (item.type === "dir") {
        const folderHeader = document.createElement("div");
        folderHeader.className = "folder-header";
        folderHeader.innerHTML = `> Folder <span>${item.name}</span>`;

        const folderContent = document.createElement("div");
        folderContent.className = "folder-content";

        let isLoaded = false;

        folderHeader.addEventListener("click", async () => {
          const isOpen = folderContent.classList.toggle("open");
          folderHeader.innerHTML = `${isOpen ? "v" : ">"} Folder <span>${item.name}</span>`;

          if (isOpen && !isLoaded) {
            folderContent.innerHTML = `<div class="loading">Loading contents...</div>`;
            await loadFolder(item.path, folderContent);
            isLoaded = true;
          }
        });

        containerElement.appendChild(folderHeader);
        containerElement.appendChild(folderContent);
      } else if (item.type === "file") {
        const fileDiv = document.createElement("div");
        fileDiv.className = "file";

        const previewButton = document.createElement("button");
        previewButton.className = "file-preview-button";
        previewButton.type = "button";
        previewButton.textContent = item.name;
        previewButton.addEventListener("click", () => openPdfPreview(item));

        fileDiv.innerHTML = `File `;
        fileDiv.appendChild(previewButton);

        containerElement.appendChild(fileDiv);
      }
    }
  } catch (error) {
    containerElement.innerHTML = `<div class="loading" style="color: #ff6b6b;">Failed to fetch contents.</div>`;
  }
}

async function fetchPdfData(file) {
  const apiResponse = await fetch(file.url, {
    headers: {
      Accept: "application/vnd.github.v3.raw"
    }
  });

  if (apiResponse.ok) {
    return await apiResponse.arrayBuffer();
  }

  const rawResponse = await fetch(file.download_url);
  if (!rawResponse.ok) {
    throw new Error("Could not fetch the PDF preview.");
  }

  return await rawResponse.arrayBuffer();
}
async function openPdfPreview(file) {
  const modal = document.getElementById("previewModal");
  const title = document.getElementById("previewTitle");
  const pages = document.getElementById("previewPages");
  const download = document.getElementById("previewDownload");
  const session = ++previewSession;

  title.textContent = file.name;
  pages.innerHTML = `<div class="loading">Loading preview...</div>`;
  download.href = file.download_url;
  download.download = file.name;
  modal.classList.add("open");

  try {
    if (!window.pdfjsLib) {
      throw new Error("PDF preview tool did not load.");
    }

    const pdfData = await fetchPdfData(file);
    const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;

    if (session !== previewSession) return;
    pages.innerHTML = "";

    for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
      if (session !== previewSession) return;

      const page = await pdf.getPage(pageNumber);
      const baseViewport = page.getViewport({ scale: 1 });
      const availableWidth = Math.max(320, pages.clientWidth - 36);
      const scale = Math.min(1.5, availableWidth / baseViewport.width);
      const viewport = page.getViewport({ scale });
      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");

      canvas.width = viewport.width;
      canvas.height = viewport.height;
      pages.appendChild(canvas);

      await page.render({ canvasContext: context, viewport }).promise;
    }
  } catch (error) {
    if (session === previewSession) {
      pages.innerHTML = `
        <div class="loading" style="color: #ff6b6b;">
          Preview could not be loaded. Please use the Download button.
        </div>`;
    }
  }
}

function closePdfPreview() {
  const modal = document.getElementById("previewModal");
  const pages = document.getElementById("previewPages");

  previewSession++;
  modal.classList.remove("open");
  pages.innerHTML = "";
}

function safeZipName(name) {
  return name.replace(/[\\/:*?"<>|]+/g, "-").trim() || "PDFs";
}

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function savePdfsIndividuallyToFolder(pdfFiles, button) {
  if (!window.showDirectoryPicker) {
    alert("Your browser does not support saving many files directly to a folder. Please use the .zip option instead.");
    return;
  }

  const originalText = button.textContent;
  button.disabled = true;

  try {
    const folderHandle = await window.showDirectoryPicker();

    for (let index = 0; index < pdfFiles.length; index++) {
      const file = pdfFiles[index];
      button.textContent = `Saving ${index + 1}/${pdfFiles.length}: ${file.name}`;

      const response = await fetch(file.download_url);
      if (!response.ok) {
        throw new Error(`Could not download ${file.name}`);
      }

      const fileHandle = await folderHandle.getFileHandle(file.name, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(await response.blob());
      await writable.close();
    }
  } catch (error) {
    if (error.name !== "AbortError") {
      alert("Could not save all PDFs individually. Please try again, or use the .zip option.");
    }
  } finally {
    button.disabled = false;
    button.textContent = originalText;
  }
}

async function downloadPdfsAsZip(folderPath, pdfFiles, button) {
  if (!window.JSZip) {
    alert("The zip download tool is still loading. Please try again in a moment.");
    return;
  }

  const originalText = button.textContent;
  button.disabled = true;
  const zip = new JSZip();

  try {
    for (let index = 0; index < pdfFiles.length; index++) {
      const file = pdfFiles[index];
      button.textContent = `Adding ${index + 1}/${pdfFiles.length}: ${file.name}`;

      const response = await fetch(file.download_url);
      if (!response.ok) {
        throw new Error(`Could not download ${file.name}`);
      }

      zip.file(file.name, await response.blob());
    }

    button.textContent = "Preparing zip...";
    const blob = await zip.generateAsync({ type: "blob" });
    const folderName = safeZipName(folderPath.split("/").filter(Boolean).pop() || "PDFs");
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `${folderName}.zip`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(link.href);
  } catch (error) {
    alert("Could not create the zip. Please try again, or use the individual download option.");
  } finally {
    button.disabled = false;
    button.textContent = originalText;
  }
}

const filesDiv = document.getElementById("files");
document.getElementById("previewClose").addEventListener("click", closePdfPreview);
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closePdfPreview();
});
filesDiv.innerHTML = `<div class="loading">Loading files...</div>`;
loadFolder("files", filesDiv);
</script>
</body>
</html>
