<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ICSE RESOURCES</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 30px;
    }

    h1 {
      color: #00ffcc;
      margin-bottom: 20px;
    }

    /* Folder Header Style */
    .folder-header {
      background: #252526;
      color: #ffd700;
      padding: 10px 14px;
      margin: 6px 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .folder-header:hover {
      background: #333333;
    }

    /* Container for nested folder contents */
    .folder-content {
      margin-left: 20px;
      border-left: 2px solid #333;
      padding-left: 10px;
      display: none; /* Hidden by default until clicked */
    }

    .folder-content.open {
      display: block;
    }

    /* File Item Style */
    .file {
      background: #1e1e1e;
      padding: 10px 14px;
      margin: 4px 0;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    a {
      color: #66ccff;
      text-decoration: none;
      font-size: 16px;
    }

    a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    .loading {
      color: #aaa;
      font-style: italic;
      padding: 6px 14px;
    }
  </style>
</head>

<body>
<h1>📂 Downloads</h1>

<div id="files"></div>
<script data-goatcounter="https://icse-resources-analytics.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<script>
const username = "Logic-Legend-Ranveer";
const repo = "public-files";

// Leave 'path' empty ("") to load the root directory of the repo automatically
async function loadFolder(path, containerElement) {
  const url = `https://api.github.com/repos/${username}/${repo}/contents/${path}`;

  try {
    const response = await fetch(url);

    // 1. Explicitly check for Rate Limiting (403)
    if (response.status === 403) {
      containerElement.innerHTML = `
        <div class="loading" style="color: #ffcc00; font-weight: bold;">
          ⚠️ GitHub API rate limit reached (60 requests/hr). <br>
          Please wait a few minutes before refreshing again.
        </div>`;
      return;
    }

    // 2. Check for missing folder/path (404)
    if (response.status === 404) {
      containerElement.innerHTML = `
        <div class="loading" style="color: #ff6b6b;">
          ❌ Folder path "${path}" was not found. Check folder names.
        </div>`;
      return;
    }

    const data = await response.json();

    containerElement.innerHTML = ""; // Clear loading text

    if (!Array.isArray(data) || data.length === 0) {
      containerElement.innerHTML = `<div class="loading">No files found in this folder.</div>`;
      return;
    }

    for (const item of data) {
      // Hide index.html itself from showing up in the explorer list
      if (item.name.toLowerCase() === "index.html") continue;

      if (item.type === "dir") {
        // Create Folder Header
        const folderHeader = document.createElement("div");
        folderHeader.className = "folder-header";
        folderHeader.innerHTML = `▶ 📁 <span>${item.name}</span>`;

        // Create Container for Sub-items
        const folderContent = document.createElement("div");
        folderContent.className = "folder-content";

        let isLoaded = false;

        folderHeader.addEventListener("click", async () => {
          const isOpen = folderContent.classList.toggle("open");
          folderHeader.innerHTML = `${isOpen ? "▼" : "▶"} 📁 <span>${item.name}</span>`;

          if (isOpen && !isLoaded) {
            folderContent.innerHTML = `<div class="loading">Loading contents...</div>`;
            await loadFolder(item.path, folderContent);
            isLoaded = true;
          }
        });

        containerElement.appendChild(folderHeader);
        containerElement.appendChild(folderContent);

      } else if (item.type === "file") {
        // Create File Link
        const fileDiv = document.createElement("div");
        fileDiv.className = "file";

        const link = document.createElement("a");
        link.href = item.download_url;
        link.textContent = item.name;
        link.target = "_blank";

        fileDiv.innerHTML = `📄 `;
        fileDiv.appendChild(link);

        containerElement.appendChild(fileDiv);
      }
    }
  } catch (error) {
    containerElement.innerHTML = `<div class="loading" style="color: #ff6b6b;">Failed to fetch contents.</div>`;
  }
}

// Initial load: Pass "" to fetch whatever folders/files live at the root of the repo
const filesDiv = document.getElementById("files");
filesDiv.innerHTML = `<div class="loading">Loading files...</div>`;
loadFolder("files", filesDiv);
</script>
</body>
</html>
